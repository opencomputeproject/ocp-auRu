# Root of the repository: development tooling only (pytest configuration). Nothing is built or
# distributed from here. Each service under services/ has its own pyproject.toml.

[tool.pytest.ini_options]
# `ocp_auru` is a PEP 420 namespace package split across the service folders. The two tests
# folders listed last hold the shared test helper modules (_mock_ru_helpers, _smo_helpers).
pythonpath = [
  "services/common",
  "services/ocp-rApp-es",
  "services/ocp-smo",
  "services/ocp-ru",
  "services/ocp-ruApp",
  "services/ocp-ru/tests",
  "services/ocp-smo/tests",
]
testpaths = [
  "services/ocp-rApp-es/tests",
  "services/ocp-smo/tests",
  "services/ocp-ru/tests",
  "services/ocp-ruApp/tests",
  "demo/tests",
]
timeout = 120
# importlib mode: test files with equal basenames in different folders do not collide.
# The physics twin has its own environment and test run (services/ocp-physics-digitalTwin).
addopts = "--import-mode=importlib"
