[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocp-smo"
version = "0.1.0"
description = "OCP Autonomous AI-RU reference implementation: SMO services (VES collector, CM routes with an M-Plane adapter, R1 data producer)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "ocp-auru-common",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "ncclient>=0.6.15",
  "paramiko>=3.4",
  "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

# `ocp_auru` is a PEP 420 namespace package shared by the services: no ocp_auru/__init__.py anywhere.
[tool.setuptools.packages.find]
where = ["."]
include = ["ocp_auru*"]
namespaces = true
